<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" type="image/svg+xml" href="%sveltekit.assets%/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="%sveltekit.assets%/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="%sveltekit.assets%/apple-touch-icon.png" />
    <link rel="mask-icon" href="%sveltekit.assets%/favicon.svg" color="#10b981" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#050706" />
    <meta name="color-scheme" content="dark" />
    <meta
      name="description"
      content="Hoard — cloud sync for game saves. Versioned, verified, self-hostable."
    />
    <meta property="og:title" content="Hoard — versioned cloud sync for game saves" />
    <meta
      property="og:description"
      content="Snapshots every time you finish playing. SHA-256 verified, EU-hosted, AGPL-3.0."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://hoard.services" />
    <meta name="twitter:card" content="summary" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
    />
    %sveltekit.head%
  </head>
  <body class="bg-zinc-950 text-zinc-100 antialiased">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
