# Fly.io configuration for Hoard Cloud.
#
# Provision:
#   fly apps create hoard-server-cloud --org <org>
#   fly volumes create hoard_data -r cdg -s 1  # not really used (R2 is the store)
#   fly secrets set \
#     HOARD__DATABASE__URL=postgres://... \
#     HOARD__CLOUD__SUPABASE_JWKS_URL=... \
#     HOARD__CLOUD__R2__ACCESS_KEY_ID=... \
#     HOARD__CLOUD__R2__SECRET_ACCESS_KEY=... \
#     HOARD__CLOUD__POLAR__WEBHOOK_SECRET=... \
#     HOARD__CLOUD__POLAR__ACCESS_TOKEN=...
#
# Billing is Polar (Merchant of Record, Stripe underneath) and nothing else.
# The deployed app still carries three `HOARD__CLOUD__LEMONSQUEEZY__*`
# secrets from the pre-Polar era; no config field reads them, so they are
# inert credentials sitting in the deployment, `fly secrets unset` them and
# revoke the key on the LS side.
#   fly deploy --dockerfile deploy/fly/Dockerfile

app = "hoard-server"
primary_region = "cdg"
kill_signal = "SIGINT"
kill_timeout = "10s"

[build]
  dockerfile = "Dockerfile"

[env]
  HOARD__SERVER__HOST = "0.0.0.0"
  HOARD__SERVER__PORT = "8082"
  HOARD__LOGGING__LEVEL = "info"
  HOARD__LOGGING__FORMAT = "json"
  HOARD__DATABASE__BACKEND = "postgres"
  # Per-machine Postgres pool. The Supabase pooler caps session-mode clients at
  # 15; with up to 3 machines (autoscale) 3×5 = 15 stays under the ceiling.
  # Avoids "EMAXCONNSESSION max clients reached" rejections under load.
  HOARD__DATABASE__MAX_CONNECTIONS = "5"
  # Per-IP rate limit. Defaults (20/s, burst 60) are too tight for a legit
  # client: a full library re-sync after install fires a burst of one request
  # per tracked save, blows past burst 60, and the governor 429s it. The app
  # then shows "Limitada", waits 60s, retries, and loops forever. Raise the
  # ceiling so a normal sync passes; this is still a safety net against
  # runaway loops (the real cost control is the storage/bandwidth quota).
  HOARD__SERVER__RATE_LIMIT__PER_SECOND = "50"
  HOARD__SERVER__RATE_LIMIT__BURST = "600"

[http_service]
  internal_port = 8082
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  # Idle to zero: with no recurrent users we don't keep a machine warm. Fly's
  # proxy cold-starts the app on the first request (a ~1-2s penalty on a small
  # Rust binary). Flip back to 1 once there's steady traffic worth the warm VM.
  min_machines_running = 0
  processes = ["app"]

[[http_service.checks]]
  interval = "15s"
  timeout = "5s"
  grace_period = "10s"
  method = "GET"
  path = "/v1/health"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 256

# Rolling deploys across the app's machines. Note this says nothing about
# how many stay up, that's `min_machines_running` above, which is 0. An
# earlier version of this comment claimed one machine is kept warm; it is
# not, and believing it hid a machine that sat started for 16 days.
[deploy]
  strategy = "rolling"
  max_unavailable = 0.3
  # Migrate as its own deploy step, in a throwaway machine, before any traffic
  # moves. A migration that fails here fails the deploy and the version already
  # serving keeps serving. Run from inside `serve`, which is what happened on
  # 2026-08-13, the same failure exits the process, Fly restarts it into the
  # identical failure, and the API stays down until someone rolls back by hand.
  release_command = "migrate"
