# Fly.io configuration for Hoard Cloud.
#
# Provision:
#   fly apps create hoard-server-cloud --org <org>
#   fly volumes create hoard_data -r cdg -s 1  # not really used (R2 is the store)
#   fly secrets set \
#     HOARD__DATABASE__URL=postgres://... \
#     HOARD__CLOUD__SUPABASE_JWKS_URL=... \
#     HOARD__CLOUD__R2__ACCESS_KEY_ID=... \
#     HOARD__CLOUD__R2__SECRET_ACCESS_KEY=... \
#     HOARD__CLOUD__LEMONSQUEEZY__WEBHOOK_SECRET=... \
#     HOARD__CLOUD__LEMONSQUEEZY__API_KEY=...
#   fly deploy --dockerfile deploy/fly/Dockerfile

app = "hoard-server"
primary_region = "cdg"
kill_signal = "SIGINT"
kill_timeout = "10s"

[env]
  HOARD__SERVER__HOST = "0.0.0.0"
  HOARD__SERVER__PORT = "8082"
  HOARD__LOGGING__LEVEL = "info"
  HOARD__LOGGING__FORMAT = "json"
  HOARD__DATABASE__BACKEND = "postgres"

[http_service]
  internal_port = 8082
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[http_service.checks]]
  interval = "15s"
  timeout = "5s"
  grace_period = "10s"
  method = "GET"
  path = "/v1/health"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512

# Autoscaling: 1-3 machines. Fly's "auto_stop" idles to zero on quiet hours;
# `min_machines_running = 1` keeps one warm so the first user request after
# a quiet patch doesn't pay the cold-start cost.
[deploy]
  strategy = "rolling"
  max_unavailable = 0.3
