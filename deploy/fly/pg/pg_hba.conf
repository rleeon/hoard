# Superuser only through the socket as the postgres OS user. The server comes
# in through the socket as the hoard OS user, no password. Over TCP only the
# hoard role with a password: loopback, and Fly's private network for the
# release_command's migrator. Nothing else matches, so nothing else gets in.
local   all     postgres                    peer
local   hoard   hoard                       peer
host    hoard   hoard       127.0.0.1/32    scram-sha-256
host    hoard   hoard       ::1/128         scram-sha-256
host    hoard   hoard       fdaa::/16       scram-sha-256
