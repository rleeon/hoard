# Where each machine's backups go comes from the environment, so prod and
# staging share this file: PGBACKREST_REPO1_S3_BUCKET, _S3_ENDPOINT, _PATH,
# and the secrets PGBACKREST_REPO1_S3_KEY, _S3_KEY_SECRET, _CIPHER_PASS.
# Without a bucket the entrypoint leaves archiving off entirely.

[global]
repo1-type=s3
repo1-s3-region=auto
repo1-s3-uri-style=path
# The bucket holds every account's email (auth.users) and more.
repo1-cipher-type=aes-256-cbc
repo1-retention-full=2
compress-type=zst
# A cluster is ~1.000 small files and R2 takes one PUT each: the first full
# backup of an empty staging database took 234 s. Bundling packs them into a
# few objects, and two processes wait on the network, not the CPU.
repo1-bundle=y
process-max=2
# Checkpoint now instead of waiting for the next one: the first backup of a
# 30 MB rehearsal database sat 110 s for it.
start-fast=y

# WAL goes up in the background, so a slow R2 never stalls a commit. If R2 is
# unreachable for long, WAL past this size is dropped rather than filling the
# 3 GB volume; Postgres keeps running and the next full backup starts a clean
# chain.
archive-async=y
archive-push-queue-max=1GiB
spool-path=/data/pgbackrest/spool
lock-path=/tmp/pgbackrest

log-level-console=info
log-level-stderr=off
log-level-file=off

[hoard]
pg1-path=/data/pg17
pg1-socket-path=/run/postgresql
pg1-user=postgres
