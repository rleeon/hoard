# Postgres for the cloud machine, sized for the 256 MB machine it may end up
# on even while it runs on 512. Measured in local with 6 concurrent clients
# (sep-2026): 52 MiB that cannot be reclaimed, and no OOM when capped at 90.
# The entrypoint adds archive_* when backups are configured and the private
# address to listen_addresses on Fly.

hba_file = '/etc/hoard/pg/pg_hba.conf'
listen_addresses = 'localhost'
port = 5432
unix_socket_directories = '/run/postgresql'

# The server's pool is 6. Three more are reserved for superusers (pgBackRest,
# a shell), which leaves the release_command's migrator room beside the pool.
max_connections = 12

shared_buffers = 32MB
work_mem = 2MB
maintenance_work_mem = 16MB
effective_cache_size = 64MB
# The volume is SSD; the default of 4 prices a random read like a spinning disk.
random_page_cost = 1.1

# One CPU. Parallel plans only add processes, each with its own memory.
max_worker_processes = 2
max_parallel_workers = 0
max_parallel_workers_per_gather = 0
max_parallel_maintenance_workers = 0
autovacuum_max_workers = 1
jit = off
huge_pages = off

wal_buffers = 1MB
wal_compression = zstd
max_wal_size = 256MB
min_wal_size = 64MB
checkpoint_timeout = 15min
archive_timeout = 300

password_encryption = scram-sha-256
# A transaction left open (a crashed client mid-request) holds back vacuum for
# the whole database for as long as it lives.
idle_in_transaction_session_timeout = 5min

timezone = 'UTC'
log_timezone = 'UTC'
datestyle = 'iso, mdy'
lc_messages = 'C.UTF-8'

logging_collector = off
log_destination = 'stderr'
log_line_prefix = 'postgres[%p]: '
log_min_duration_statement = 1000
log_autovacuum_min_duration = 10s

# What found every slow query of the Supabase era. ~2 MB of shared memory at
# this size.
shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.max = 1000
