name: Bug report
description: Something is broken or not behaving as documented.
title: "[bug] "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report! Please fill out as much as you can.
        Vague reports are hard to act on.

  - type: input
    id: version
    attributes:
      label: Hoard version
      description: Output of `hoard --version` or `hoard-server --version`, or the commit SHA if from source.
      placeholder: "0.1.0 / abc1234"
    validations:
      required: true

  - type: dropdown
    id: deployment
    attributes:
      label: Deployment
      options:
        - bare-metal systemd
        - Docker / Compose
        - cargo run (dev)
        - other
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: OS / kernel
      placeholder: "Debian 12, kernel 6.1"
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: What actually happened?
      description: Include exact error messages, status codes, or unexpected behavior.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Reproduction steps
      description: Concrete commands. The fewer steps, the faster we can fix it.
      placeholder: |
        1. `hoard backup ... --from /tmp/x`
        2. observe ...
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: |
        For server bugs: `journalctl -u hoard-server` or `docker compose logs server`.
        For CLI bugs: re-run with `RUST_LOG=hoard_cli=debug` and paste the output.
      render: shell
