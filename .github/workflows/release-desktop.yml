name: Release (desktop)

# Runs alongside `release.yml` on the same `v*.*.*` tag. The server release
# workflow handles the headless tarball; this one packages the Tauri desktop
# app into native installers and uploads them as additional release assets.
#
# Code signing isn't wired in for v0.2 — Linux/Windows/macOS users will see
# their OS's "unverified developer" warning on first run. See
# `docs/install-client.md` for the workaround. Once we have signing certs
# we'll set the relevant env vars (TAURI_SIGNING_*, APPLE_*, WINDOWS_*) as
# repository secrets and the Tauri Action will pick them up automatically.

on:
  # Canonical desktop release path. The Pro layer (overlay + Wrapped) now lives
  # in-repo, so this single workflow builds the full bundles — no private
  # `hoard-build`/`hoard-pro` overlay any more. Runs on `v*` tags alongside
  # `release.yml` (which attaches the headless server tarball; different
  # filenames, no clash) and can be dispatched manually for a one-off build.
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  SQLX_OFFLINE: "true"

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            label: linux-x86_64
            target: x86_64-unknown-linux-gnu
            args: ""
          - os: windows-latest
            label: windows-x86_64
            target: x86_64-pc-windows-msvc
            args: ""
          # Apple-silicon only — macos-13 (x86_64) is being retired by
          # GitHub and queues for the legacy intel image stall for hours,
          # which used to block the entire `publish` job. macos-14 builds
          # the universal-aarch64 bundle and runs reliably.
          - os: macos-14
            label: macos-aarch64
            target: aarch64-apple-darwin
            args: "--target aarch64-apple-darwin"
            optional: true
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.optional == true }}
    # Keep the cap tight so a runner that never picks up the job (queued
    # forever) eventually fails instead of pinning `publish` open. 45min
    # is enough for a cold cargo build + Tauri bundle on every platform.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install pnpm
        uses: pnpm/action-setup@a3252b78c470c02df07e9d59298aecedc3ccdd6d # v3
        with:
          version: 9

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: crates/hoard-desktop/ui/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          # Tauri's `target/` lives under `crates/hoard-desktop/`-adjacent
          # paths in our setup — but the workspace target is the canonical
          # one, so default cache key works.
          shared-key: desktop-${{ matrix.label }}

      - name: System deps (Linux)
        if: runner.os == 'Linux'
        run: |
          # ubuntu-22.04 ships libpipewire-0.3-dev 0.3.48, too old for the
          # `libspa` 0.10 Rust bindings the Wayland sidecar uses (missing
          # spa_meta_region_is_valid / spa_video_info_raw.flags). Pull a recent
          # PipeWire from the upstream PPA. We stay on 22.04 so the AppImage
          # keeps linking against an older glibc and runs on more distros.
          sudo add-apt-repository -y ppa:pipewire-debian/pipewire-upstream
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libwayland-dev \
            libxkbcommon-dev \
            libpipewire-0.3-dev \
            clang

      - name: Build overlay sidecar (hoard-screen)
        shell: bash
        run: bash scripts/build-sidecar.sh

      - name: Install frontend deps
        run: pnpm --dir crates/hoard-desktop/ui install --frozen-lockfile

      - name: Build desktop bundle
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          # When we set up code signing, these are the env vars the Tauri
          # action picks up:
          #   TAURI_SIGNING_PRIVATE_KEY        — for the auto-updater
          #   TAURI_SIGNING_PRIVATE_KEY_PASSWORD
          #   APPLE_CERTIFICATE                — macOS code-signing
          #   APPLE_CERTIFICATE_PASSWORD
          #   APPLE_SIGNING_IDENTITY
          #   APPLE_ID
          #   APPLE_TEAM_ID
          #   APPLE_PASSWORD                   — app-specific notarization pwd
          # Until they're populated, the action falls back to unsigned bundles.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: crates/hoard-desktop
          args: ${{ matrix.args }}
          # We don't let tauri-action create the GitHub release itself —
          # `release.yml` is the source of truth for the release object.
          # We only want it to build, then we upload bundles below.
          tagName: ""
          releaseName: ""

      - name: Strip host libs from AppImage (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: bash scripts/fix-appimage-libs.sh "target/${{ matrix.target }}/release/bundle"

      - name: Collect bundles
        id: collect
        shell: bash
        run: |
          set -e
          mkdir -p dist
          # Tauri spits everything into target/<triple>/release/bundle/<format>/
          BUNDLE_ROOT="target/${{ matrix.target }}/release/bundle"
          # Linux bundles can also live under target/release/bundle when no
          # explicit target was passed.
          if [ ! -d "$BUNDLE_ROOT" ]; then
            BUNDLE_ROOT="target/release/bundle"
          fi
          echo "Looking under $BUNDLE_ROOT"
          find "$BUNDLE_ROOT" -type f \
            \( -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' \
               -o -name '*.msi' -o -name '*.exe' \
               -o -name '*.dmg' -o -name '*.app.tar.gz' \) \
            -exec cp -v {} dist/ \; || true
          ls -la dist/
          # macOS runners don't ship GNU coreutils, so `sha256sum` is missing
          # there. Fall back to BSD `shasum -a 256` (present on macOS by
          # default and on Linux since BSD utils are also packaged everywhere
          # we care about).
          if command -v sha256sum >/dev/null 2>&1; then
            sha256_cmd() { sha256sum "$1"; }
          else
            sha256_cmd() { shasum -a 256 "$1"; }
          fi
          ( cd dist && for f in *; do sha256_cmd "$f" > "$f.sha256"; done )
          echo "label=${{ matrix.label }}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hoard-desktop-${{ matrix.label }}
          path: dist/*

  publish:
    name: Attach to release
    needs: build
    runs-on: ubuntu-latest
    # `success() || failure()` so we publish whatever artifacts did build
    # even if the optional macOS entry failed. We skip on `cancelled()`
    # (manual cancel) and on `workflow_dispatch` runs with no tag.
    if: ${{ (success() || failure()) && startsWith(github.ref, 'refs/tags/') }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          merge-multiple: true
      - name: List
        run: ls -la dist/
      # Sign every installer with minisign so the in-app auto-updater
      # (`apply_desktop_update`) can verify it against the public key embedded
      # in the client before running it as root via pkexec — same key and
      # fail-closed model the server's `hoard-server upgrade` uses (ADR 0017).
      # The secret lives only in repo secrets. If it isn't configured we warn
      # loudly: unsigned installers make the client fall back to a *manual*
      # download instead of auto-installing, so updates degrade rather than run
      # an unverified binary.
      - name: Sign bundles (minisign)
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          MINISIGN_KEY_PASSWORD: ${{ secrets.MINISIGN_KEY_PASSWORD }}
        run: |
          if [ -z "${MINISIGN_SECRET_KEY:-}" ]; then
            echo "::warning::MINISIGN_SECRET_KEY not set — desktop installers will be UNSIGNED. The in-app updater will refuse to auto-install them and fall back to manual download."
            exit 0
          fi
          sudo apt-get update && sudo apt-get install -y minisign
          printf '%s' "$MINISIGN_SECRET_KEY" > minisign.key
          # Sign each installer artifact (not the .sha256 sidecars, not an
          # existing .minisig). minisign reads the password from stdin.
          shopt -s nullglob
          for f in dist/*; do
            case "$f" in
              *.sha256|*.minisig) continue ;;
            esac
            [ -f "$f" ] || continue
            printf '%s\n' "${MINISIGN_KEY_PASSWORD:-}" | \
              minisign -S -s minisign.key -m "$f"
            test -f "$f.minisig" || { echo "::error::signing produced no .minisig for $f"; exit 1; }
          done
          rm -f minisign.key
          ls -la dist/
      - name: Upload to release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ github.ref_name }}
          # Don't recreate the release; just upload more files into it.
          files: |
            dist/*
          fail_on_unmatched_files: false
