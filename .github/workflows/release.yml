name: Release

on:
  push:
    tags: ["v*.*.*"]

env:
  CARGO_TERM_COLOR: always
  SQLX_OFFLINE: "true"

permissions:
  contents: write   # needed to create the GitHub Release

jobs:
  build:
    name: build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: linux-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: System deps
        # libdbus-1-dev is needed by `libdbus-sys`, which gets pulled in
        # transitively via hoard-cli → hoard-agent → keyring (its
        # `sync-secret-service` feature). The CI workflow doesn't hit this
        # because libwebkit2gtk-4.1-dev's deps include dbus, but the slim
        # server-release runner has neither.
        run: sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config libdbus-1-dev

      - name: Build release binaries
        run: |
          cargo build --release --target ${{ matrix.target }} \
            -p hoard-server -p hoard-admin -p hoard-cli

      - name: Package
        id: package
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ARTIFACT="hoard-${VERSION}-${{ matrix.artifact }}"
          mkdir -p "dist/$ARTIFACT"
          cp target/${{ matrix.target }}/release/hoard-server "dist/$ARTIFACT/"
          cp target/${{ matrix.target }}/release/hoard-admin  "dist/$ARTIFACT/"
          cp target/${{ matrix.target }}/release/hoard        "dist/$ARTIFACT/"
          cp README.md CHANGELOG.md LICENSE                   "dist/$ARTIFACT/"
          cp deploy/config.toml.example                       "dist/$ARTIFACT/"
          tar -C dist -czf "dist/$ARTIFACT.tar.gz" "$ARTIFACT"
          ( cd dist && sha256sum "$ARTIFACT.tar.gz" > "$ARTIFACT.tar.gz.sha256" )
          echo "artifact=$ARTIFACT" >> "$GITHUB_OUTPUT"

      # Sign the tarball with minisign so `hoard-server upgrade` can verify it
      # against the public key embedded in the binary (ADR 0017). The secret
      # key lives only in repo secrets and never touches the runner's disk
      # beyond this ephemeral step. If the signing secret isn't configured we
      # skip and warn loudly — the release just won't be auto-upgradable
      # (the client fails closed on the missing/invalid signature).
      - name: Sign artifact (minisign)
        id: sign
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          MINISIGN_KEY_PASSWORD: ${{ secrets.MINISIGN_KEY_PASSWORD }}
        run: |
          if [ -z "${MINISIGN_SECRET_KEY:-}" ]; then
            echo "::warning::MINISIGN_SECRET_KEY not set — skipping signature. This release will NOT be installable via the in-app server upgrade."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          sudo apt-get install -y minisign
          printf '%s' "$MINISIGN_SECRET_KEY" > minisign.key
          TARBALL="dist/${{ steps.package.outputs.artifact }}.tar.gz"
          # minisign reads the key password from stdin when stdin isn't a TTY.
          printf '%s\n' "${MINISIGN_KEY_PASSWORD:-}" | \
            minisign -S -s minisign.key -m "$TARBALL"
          rm -f minisign.key
          test -f "$TARBALL.minisig" || { echo "::error::signing produced no .minisig"; exit 1; }
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.artifact }}
          path: |
            dist/${{ steps.package.outputs.artifact }}.tar.gz
            dist/${{ steps.package.outputs.artifact }}.tar.gz.sha256
            dist/${{ steps.package.outputs.artifact }}.tar.gz.minisig
          if-no-files-found: warn

  release:
    name: GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: List artifacts
        run: ls -la dist/
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: |
            See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/CHANGELOG.md) for the full list of changes.

            ## Verifying downloads

            ```sh
            sha256sum -c hoard-*.tar.gz.sha256
            # Signature (same key the in-app server upgrade trusts):
            minisign -Vm hoard-*.tar.gz -P <hoard-public-key>
            ```
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            dist/*.tar.gz
            dist/*.sha256
            dist/*.minisig
