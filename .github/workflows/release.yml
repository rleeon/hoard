name: Release

on:
  push:
    tags: ["v*.*.*"]

env:
  CARGO_TERM_COLOR: always
  SQLX_OFFLINE: "true"

permissions:
  contents: write   # needed to create the GitHub Release

jobs:
  build:
    name: build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: linux-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: System deps
        # libdbus-1-dev is needed by `libdbus-sys`, which gets pulled in
        # transitively via hoard-cli → hoard-agent → keyring (its
        # `sync-secret-service` feature). The CI workflow doesn't hit this
        # because libwebkit2gtk-4.1-dev's deps include dbus, but the slim
        # server-release runner has neither.
        run: sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config libdbus-1-dev

      - name: Build release binaries
        run: |
          cargo build --release --target ${{ matrix.target }} \
            -p hoard-server -p hoard-admin -p hoard-cli

      - name: Package
        id: package
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ARTIFACT="hoard-${VERSION}-${{ matrix.artifact }}"
          mkdir -p "dist/$ARTIFACT"
          cp target/${{ matrix.target }}/release/hoard-server "dist/$ARTIFACT/"
          cp target/${{ matrix.target }}/release/hoard-admin  "dist/$ARTIFACT/"
          cp target/${{ matrix.target }}/release/hoard        "dist/$ARTIFACT/"
          cp README.md CHANGELOG.md LICENSE                   "dist/$ARTIFACT/"
          cp deploy/config.toml.example                       "dist/$ARTIFACT/"
          tar -C dist -czf "dist/$ARTIFACT.tar.gz" "$ARTIFACT"
          ( cd dist && sha256sum "$ARTIFACT.tar.gz" > "$ARTIFACT.tar.gz.sha256" )
          echo "artifact=$ARTIFACT" >> "$GITHUB_OUTPUT"

      # NOTE: signing happens in the isolated `sign` job below, NOT here. This
      # `build` job compiles untrusted third-party code (cargo deps + build
      # scripts) and so must never see MINISIGN_SECRET_KEY — a malicious dep
      # could otherwise exfiltrate the release-signing key. We only emit the
      # unsigned tarball + checksum as artifacts.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.package.outputs.artifact }}
          path: |
            dist/${{ steps.package.outputs.artifact }}.tar.gz
            dist/${{ steps.package.outputs.artifact }}.tar.gz.sha256
          if-no-files-found: warn

  sign:
    name: Sign artifacts (minisign)
    needs: build
    runs-on: ubuntu-latest
    # Isolated signing job: no checkout, no cargo, no build scripts — the only
    # code that runs is the trusted `minisign` package and this script, so the
    # MINISIGN_SECRET_KEY is never exposed to third-party code (ADR 0017). The
    # secret lives only in repo secrets and only touches this runner's disk for
    # the lifetime of the step. If the signing secret isn't configured we skip
    # and warn loudly — the release just won't be auto-upgradable (the client
    # fails closed on the missing/invalid signature).
    #
    # Recommended hardening: gate this job behind a protected GitHub Environment
    # with required reviewers so the signing key can't be used by an
    # unreviewed workflow run.
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true
      - name: Sign tarballs
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          MINISIGN_KEY_PASSWORD: ${{ secrets.MINISIGN_KEY_PASSWORD }}
        run: |
          if [ -z "${MINISIGN_SECRET_KEY:-}" ]; then
            echo "::warning::MINISIGN_SECRET_KEY not set — skipping signature. This release will NOT be installable via the in-app server upgrade."
            exit 0
          fi
          sudo apt-get update && sudo apt-get install -y minisign
          printf '%s' "$MINISIGN_SECRET_KEY" > minisign.key
          for TARBALL in dist/*.tar.gz; do
            # minisign reads the key password from stdin when stdin isn't a TTY.
            printf '%s\n' "${MINISIGN_KEY_PASSWORD:-}" | \
              minisign -S -s minisign.key -m "$TARBALL"
            test -f "$TARBALL.minisig" || { echo "::error::signing produced no .minisig for $TARBALL"; exit 1; }
          done
          rm -f minisign.key
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: signatures
          path: dist/*.minisig
          if-no-files-found: warn

  release:
    name: GitHub Release
    needs: [build, sign]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true
      - name: List artifacts
        run: ls -la dist/
      - name: Create release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: |
            See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/CHANGELOG.md) for the full list of changes.

            ## Verifying downloads

            ```sh
            sha256sum -c hoard-*.tar.gz.sha256
            # Signature (same key the in-app server upgrade trusts):
            minisign -Vm hoard-*.tar.gz -P <hoard-public-key>
            ```
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            dist/*.tar.gz
            dist/*.sha256
            dist/*.minisig
