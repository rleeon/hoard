name: Release

on:
  push:
    tags: ["v*.*.*"]

env:
  CARGO_TERM_COLOR: always
  SQLX_OFFLINE: "true"

permissions:
  contents: write   # needed to create the GitHub Release

jobs:
  build:
    name: build (${{ matrix.artifact }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux keeps the full self-host bundle (CLI + server + admin). The
          # other platforms ship the `hoard` CLI only — the server/admin are
          # meant to run on a Linux box. Every target builds on a NATIVE runner
          # so we never cross-compile the dbus/keyring/OpenSSL C deps.
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: linux-x86_64
            full: true
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            artifact: linux-aarch64
            full: true
          - os: macos-latest # Apple Silicon runner
            target: aarch64-apple-darwin
            artifact: macos-aarch64
            full: false
          # Intel macOS (macos-13) is being retired by GitHub — the runner
          # queues forever and never picks the job up, pinning `sign`/`publish`
          # open (they `needs: build`). The Apple-silicon dmg covers Mac; drop
          # the x86_64 tarball rather than block the whole release, matching
          # release-desktop.yml which already ships only macos-aarch64.
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: windows-x86_64
            full: false
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            artifact: windows-aarch64
            full: false
    runs-on: ${{ matrix.os }}
    # Safety net: a runner that never gets picked up (as macos-13 did) should
    # fail after a bounded wait instead of hanging the release for hours.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: System deps
        # libdbus-1-dev is needed by `libdbus-sys`, pulled in transitively via
        # hoard-cli → hoard-agent → keyring (its `sync-secret-service` feature).
        # Linux only — macOS (Keychain) and Windows (DPAPI) use native stores
        # with no C dependency.
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config libdbus-1-dev

      - name: Build release binaries
        shell: bash
        run: |
          if [ "${{ matrix.full }}" = "true" ]; then
            cargo build --release --target ${{ matrix.target }} \
              -p hoard-server -p hoard-admin -p hoard-cli
          else
            cargo build --release --target ${{ matrix.target }} -p hoard-cli
          fi

      - name: Package
        id: package
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ARTIFACT="hoard-${VERSION}-${{ matrix.artifact }}"
          BIN="target/${{ matrix.target }}/release"
          EXT=""
          [ "${{ runner.os }}" = "Windows" ] && EXT=".exe"
          mkdir -p "dist/$ARTIFACT"
          cp "$BIN/hoard$EXT" "dist/$ARTIFACT/"
          if [ "${{ matrix.full }}" = "true" ]; then
            cp "$BIN/hoard-server$EXT" "dist/$ARTIFACT/"
            cp "$BIN/hoard-admin$EXT"  "dist/$ARTIFACT/"
            cp deploy/config.toml.example "dist/$ARTIFACT/"
          fi
          cp README.md CHANGELOG.md LICENSE "dist/$ARTIFACT/"
          tar -C dist -czf "dist/$ARTIFACT.tar.gz" "$ARTIFACT"
          ( cd dist && sha256sum "$ARTIFACT.tar.gz" > "$ARTIFACT.tar.gz.sha256" )
          echo "artifact=$ARTIFACT" >> "$GITHUB_OUTPUT"

      # NOTE: signing happens in the isolated `sign` job below, NOT here. This
      # `build` job compiles untrusted third-party code (cargo deps + build
      # scripts) and so must never see MINISIGN_SECRET_KEY — a malicious dep
      # could otherwise exfiltrate the release-signing key. We only emit the
      # unsigned tarball + checksum as artifacts.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.package.outputs.artifact }}
          path: |
            dist/${{ steps.package.outputs.artifact }}.tar.gz
            dist/${{ steps.package.outputs.artifact }}.tar.gz.sha256
          if-no-files-found: warn

  sign:
    name: Sign artifacts (minisign)
    needs: build
    runs-on: ubuntu-latest
    # Isolated signing job: no checkout, no cargo, no build scripts — the only
    # code that runs is the trusted `minisign` package and this script, so the
    # MINISIGN_SECRET_KEY is never exposed to third-party code (ADR 0017). The
    # secret lives only in repo secrets and only touches this runner's disk for
    # the lifetime of the step. If the signing secret isn't configured we skip
    # and warn loudly — the release just won't be auto-upgradable (the client
    # fails closed on the missing/invalid signature).
    #
    # Recommended hardening: gate this job behind a protected GitHub Environment
    # with required reviewers so the signing key can't be used by an
    # unreviewed workflow run.
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          merge-multiple: true
      - name: Sign tarballs
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          MINISIGN_KEY_PASSWORD: ${{ secrets.MINISIGN_KEY_PASSWORD }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "${MINISIGN_SECRET_KEY:-}" ]; then
            echo "::warning::MINISIGN_SECRET_KEY not set — skipping signature. This release will NOT be installable via the in-app server upgrade."
            exit 0
          fi
          sudo apt-get update && sudo apt-get install -y minisign
          printf '%s' "$MINISIGN_SECRET_KEY" > minisign.key
          for TARBALL in dist/*.tar.gz; do
            # minisign reads the key password from stdin when stdin isn't a TTY.
            printf '%s\n' "${MINISIGN_KEY_PASSWORD:-}" | \
              minisign -S -s minisign.key -m "$TARBALL"
            test -f "$TARBALL.minisig" || { echo "::error::signing produced no .minisig for $TARBALL"; exit 1; }
          done

          # Also sign the desktop installers (.msi/.exe/.dmg/.AppImage/.deb).
          # They're built+uploaded by the private hoard-build workflow, whose
          # `gh release create` is what pushed this tag and triggered us — so by
          # now they already exist on the release. Without a `<installer>.minisig`
          # the in-app updater treats the build as Unsigned and only DOWNLOADS it
          # instead of running the installer (see MINISIGN_PUBKEY +
          # verify_installer_signature in hoard-desktop/.../updates.rs). We sign
          # here, in the same isolated key-holding job, rather than copying the
          # secret into hoard-build (ADR 0017).
          mkdir -p inst
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --dir inst \
            --pattern '*.msi' --pattern '*-setup.exe' --pattern '*.dmg' \
            --pattern '*.AppImage' --pattern '*.deb' || true
          for f in inst/*; do
            [ -f "$f" ] || continue
            printf '%s\n' "${MINISIGN_KEY_PASSWORD:-}" | minisign -S -s minisign.key -m "$f"
            test -f "$f.minisig" || { echo "::error::signing produced no .minisig for $f"; exit 1; }
            cp "$f.minisig" dist/
          done

          rm -f minisign.key
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: signatures
          path: dist/*.minisig
          if-no-files-found: warn

  release:
    name: GitHub Release
    needs: [build, sign]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          merge-multiple: true
      - name: List artifacts
        run: ls -la dist/
      - name: Create release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: |
            See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/CHANGELOG.md) for the full list of changes.

            ## Verifying downloads

            ```sh
            sha256sum -c hoard-*.tar.gz.sha256
            # Signature (same key the in-app server upgrade trusts):
            minisign -Vm hoard-*.tar.gz -P <hoard-public-key>
            ```
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            dist/*.tar.gz
            dist/*.sha256
            dist/*.minisig
