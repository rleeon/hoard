name: CI

on:
  push:
    branches: [master, main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  SQLX_OFFLINE: "true"

jobs:
  fmt:
    name: cargo fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: cargo clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: crates/hoard-desktop/ui/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: System deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libssl-dev pkg-config \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libglib2.0-dev
      # The desktop crate's `tauri::generate_context!()` proc-macro validates
      # `frontendDist` ("./ui/dist") at compile time, so the frontend must be
      # built before any cargo invocation that touches hoard-desktop.
      - name: Install frontend deps
        run: pnpm --dir crates/hoard-desktop/ui install --frozen-lockfile
      - name: Build frontend
        run: pnpm --dir crates/hoard-desktop/ui build
      - run: cargo clippy --workspace --all-targets -- -D warnings

  build-test:
    name: build + test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: crates/hoard-desktop/ui/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: System deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libssl-dev pkg-config \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libglib2.0-dev
      # The desktop crate's `tauri::generate_context!()` proc-macro validates
      # `frontendDist` ("./ui/dist") at compile time, so the frontend must be
      # built before any cargo invocation that touches hoard-desktop.
      - name: Install frontend deps
        run: pnpm --dir crates/hoard-desktop/ui install --frozen-lockfile
      - name: Build frontend
        run: pnpm --dir crates/hoard-desktop/ui build
      - run: cargo build --workspace --verbose
      - run: cargo test --workspace --verbose
