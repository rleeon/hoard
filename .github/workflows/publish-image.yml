name: Publish container image

# Builds the self-hosted server image and pushes it to GitHub Container
# Registry and Docker Hub so operators can `docker pull` it (and update with
# Dockge/dockhand/Watchtower) instead of building from source on their NAS.
#
# Runs only on a version tag — same cadence as the desktop/server release
# workflows — so it never spends Actions minutes on routine pushes. First image
# lands with the next `vX.Y.Z` tag.
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

concurrency:
  group: publish-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    name: build + push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      # linux/arm64 is emulated via QEMU (many NAS boxes are arm64). The
      # emulated Rust release build is slow but only runs once per release. If
      # your target is x86-only, drop arm64 from `platforms` below to halve it.
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Docker Hub mirror, enabled by adding the DOCKERHUB_USERNAME and
      # DOCKERHUB_TOKEN repository secrets. Until then only GHCR gets the
      # image, so a release never fails for want of a token.
      #
      # The image list has to be newline-separated: metadata-action reads
      # `images` with ignoreComma, because a comma is how an entry carries its
      # own options (`name=...,enable=...`). Comma-joining two registries here
      # yields one image called `a,b` and buildx rejects the reference.
      #
      # The Hub namespace is the login user, so one secret cannot disagree with
      # the other.
      - name: Decide registries
        id: registries
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          {
            echo "images<<IMAGES_EOF"
            echo "ghcr.io/${GITHUB_REPOSITORY}"
            if [ -n "$DOCKERHUB_USERNAME" ]; then
              echo "docker.io/${DOCKERHUB_USERNAME}/hoard"
            fi
            echo "IMAGES_EOF"
          } >> "$GITHUB_OUTPUT"
          if [ -n "$DOCKERHUB_USERNAME" ]; then
            echo "hub=true" >> "$GITHUB_OUTPUT"
          else
            echo "hub=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to Docker Hub
        if: steps.registries.outputs.hub == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Derive tags + labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.registries.outputs.images }}
          # v1.2.3 -> :1.2.3, :1.2, and :latest (default flavor latest=auto).
          #
          # `semver` only matches on a tag ref, so a manual `workflow_dispatch`
          # used to derive NO tags at all and push an image nobody could pull.
          # `:edge` gives the run off a branch somewhere to land — the point of
          # dispatching by hand is shipping a server fix to a self-hoster to
          # diagnose with, without cutting a release or moving the `:latest`
          # everyone else's compose is pinned to.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=edge,enable=${{ github.ref_type != 'tag' }}

      - name: Build + push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: deploy/docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
