name: Publish container image

# Builds the self-hosted server image and pushes it to GitHub Container
# Registry and Docker Hub so operators can `docker pull` it (and update with
# Dockge/dockhand/Watchtower) instead of building from source on their NAS.
#
# Runs only on a version tag, same cadence as the desktop/server release
# workflows, so it never spends Actions minutes on routine pushes.
#
# Each architecture builds on a runner of its own architecture and pushes what
# it built by digest; a last job ties the digests together into one multi-arch
# tag. It used to be a single job building both under QEMU, and emulating a
# Rust release build cost between 1h15 and 2h42 against the ~30 min the desktop
# bundles take on native runners. That gap is why the image landed long after
# the release it belongs to.
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

concurrency:
  group: publish-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            os: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            os: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      # No QEMU: each arch is native here.
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Docker Hub mirror, enabled by adding the DOCKERHUB_USERNAME and
      # DOCKERHUB_TOKEN repository secrets. Until then only GHCR gets the
      # image, so a release never fails for want of a token.
      #
      # Two shapes of the same list. `images` is newline-separated because
      # metadata-action reads it with ignoreComma, a comma being how an entry
      # carries its own options (`name=...,enable=...`); comma-joining two
      # registries there yields one image called `a,b` and buildx rejects the
      # reference. `names` is the comma-separated form the image exporter
      # wants, quoted at the point of use for the same reason.
      #
      # The Hub namespace is the login user, so one secret cannot disagree with
      # the other.
      - name: Decide registries
        id: registries
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          names="ghcr.io/${GITHUB_REPOSITORY}"
          if [ -n "$DOCKERHUB_USERNAME" ]; then
            names="$names,docker.io/${DOCKERHUB_USERNAME}/hoard"
          fi
          echo "names=$names" >> "$GITHUB_OUTPUT"
          {
            echo "images<<IMAGES_EOF"
            echo "$names" | tr ',' '\n'
            echo "IMAGES_EOF"
          } >> "$GITHUB_OUTPUT"
          if [ -n "$DOCKERHUB_USERNAME" ]; then
            echo "hub=true" >> "$GITHUB_OUTPUT"
          else
            echo "hub=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to Docker Hub
        if: steps.registries.outputs.hub == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Labels only. The tags are put on in `merge`, where the multi-arch index
      # they belong to is the thing that exists.
      - name: Derive labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.registries.outputs.images }}

      # Pushed by digest into every configured registry, so the blobs `merge`
      # points a tag at are already sitting where that tag will live.
      - name: Build + push by digest
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: deploy/docker/Dockerfile
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: 'type=image,"name=${{ steps.registries.outputs.names }}",push-by-digest=true,name-canonical=true,push=true'
          # Scoped per arch: one shared scope has the two builds evicting each
          # other's layers on every run.
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

      # The file name is the digest; the file itself is empty. `merge` only
      # needs to learn which digests exist.
      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest='${{ steps.build.outputs.digest }}'
          test -n "$digest" || { echo "::error::the build produced no digest"; exit 1; }
          touch "/tmp/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digests-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: merge + tag
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Decide registries
        id: registries
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          names="ghcr.io/${GITHUB_REPOSITORY}"
          if [ -n "$DOCKERHUB_USERNAME" ]; then
            names="$names,docker.io/${DOCKERHUB_USERNAME}/hoard"
          fi
          echo "names=$names" >> "$GITHUB_OUTPUT"
          {
            echo "images<<IMAGES_EOF"
            echo "$names" | tr ',' '\n'
            echo "IMAGES_EOF"
          } >> "$GITHUB_OUTPUT"
          if [ -n "$DOCKERHUB_USERNAME" ]; then
            echo "hub=true" >> "$GITHUB_OUTPUT"
          else
            echo "hub=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to Docker Hub
        if: steps.registries.outputs.hub == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Derive tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.registries.outputs.images }}
          # v1.2.3 -> :1.2.3, :1.2, and :latest (default flavor latest=auto).
          #
          # `semver` only matches on a tag ref, so a manual `workflow_dispatch`
          # used to derive NO tags at all and push an image nobody could pull.
          # `:edge` gives the run off a branch somewhere to land, the point of
          # dispatching by hand is shipping a server fix to a self-hoster to
          # diagnose with, without cutting a release or moving the `:latest`
          # everyone else's compose is pinned to.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=edge,enable=${{ github.ref_type != 'tag' }}

      # One index per registry, built from the digests that registry already
      # holds. Doing it per registry rather than in one call keeps every source
      # in the same repository as the tag being written, which is the case
      # `imagetools` handles without copying blobs between hosts.
      - name: Create the multi-arch tags
        env:
          NAMES: ${{ steps.registries.outputs.names }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          digests=$(ls /tmp/digests)
          test -n "$digests" || { echo "::error::no digests to merge"; exit 1; }
          echo "$NAMES" | tr ',' '\n' | while read -r name; do
            [ -n "$name" ] || continue
            args=""
            while read -r tag; do
              case "$tag" in "$name":*) args="$args --tag $tag" ;; esac
            done <<< "$TAGS"
            if [ -z "$args" ]; then
              echo "::warning::no tags derived for $name, skipping"
              continue
            fi
            srcs=""
            for d in $digests; do srcs="$srcs $name@sha256:$d"; done
            echo "==> $name"
            # shellcheck disable=SC2086
            docker buildx imagetools create $args $srcs
          done

      - name: Show what landed
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          while read -r tag; do
            [ -n "$tag" ] || continue
            docker buildx imagetools inspect "$tag" || true
          done <<< "$TAGS"
