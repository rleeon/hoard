name: Publish container image

# Builds the self-hosted server image and pushes it to GitHub Container
# Registry so operators can `docker pull ghcr.io/rleeon/hoard:<tag>` (and update
# with Dockge/dockhand/Watchtower) instead of building from source on their NAS.
#
# Runs only on a version tag — same cadence as the desktop/server release
# workflows — so it never spends Actions minutes on routine pushes. First image
# lands with the next `vX.Y.Z` tag.
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

concurrency:
  group: publish-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    name: build + push (ghcr.io)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      # linux/arm64 is emulated via QEMU (many NAS boxes are arm64). The
      # emulated Rust release build is slow but only runs once per release. If
      # your target is x86-only, drop arm64 from `platforms` below to halve it.
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags + labels
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/${{ github.repository }}
          # v1.2.3 -> :1.2.3, :1.2, and :latest (default flavor latest=auto).
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build + push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
