name: Deploy web

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/deploy-web.yml'
      # The version the build-time seed is read from. A release commit touches
      # this and is pushed by hand, so it is what actually gets the new version
      # onto the site (see the `release` trigger below). Not CHANGELOG.md: it
      # is edited between releases too, and the seed date it feeds is corrected
      # by the live lookup anyway.
      - 'Cargo.toml'
  # Kept, but it has not fired since 2026-07-09: the release stopped being cut
  # by hand and is now created by an action holding the default GITHUB_TOKEN,
  # and GitHub does not start a workflow from an event one of its own tokens
  # raised. That is why the site sat on 7.7.8 through 1.1.6 while its download
  # links pointed at a tag that was never published. The `paths` entries above
  # are what carry the version now; this stays for a release cut by a person.
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: deploy-web
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: 'pnpm'
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Build
        working-directory: web
        env:
          PUBLIC_SUPABASE_URL: ${{ secrets.PUBLIC_SUPABASE_URL }}
          PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.PUBLIC_SUPABASE_ANON_KEY }}
          PUBLIC_API_URL: ${{ secrets.PUBLIC_API_URL }}
          PUBLIC_TURNSTILE_SITE_KEY: ${{ secrets.PUBLIC_TURNSTILE_SITE_KEY }}
          PUBLIC_CHECKOUT_PRO_MONTHLY: ${{ secrets.PUBLIC_CHECKOUT_PRO_MONTHLY }}
          PUBLIC_CHECKOUT_PRO_YEARLY: ${{ secrets.PUBLIC_CHECKOUT_PRO_YEARLY }}
          PUBLIC_BILLING_PORTAL: ${{ secrets.PUBLIC_BILLING_PORTAL }}
        run: pnpm build

      - name: Preserve CNAME
        run: echo "hoard.services" > web/build/CNAME

      - name: SPA fallback for GitHub Pages (deep links → 404 → SPA shell)
        run: cp web/build/200.html web/build/404.html

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./web/build
          publish_branch: gh-pages
          force_orphan: true
          commit_message: 'deploy: web ${{ github.sha }}'
