name: Deploy web

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/deploy-web.yml'
  # Rebuild on every published release so the version baked into the site
  # (the build-time seed from Cargo.toml) tracks the app automatically. A
  # release only bumps Cargo.toml/CHANGELOG, which the `paths` filter above
  # ignores, so without this the displayed version would lag behind the app.
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: deploy-web
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Build
        working-directory: web
        env:
          PUBLIC_SUPABASE_URL: ${{ secrets.PUBLIC_SUPABASE_URL }}
          PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.PUBLIC_SUPABASE_ANON_KEY }}
          PUBLIC_API_URL: ${{ secrets.PUBLIC_API_URL }}
          PUBLIC_LS_CHECKOUT_PRO_MONTHLY: ${{ secrets.PUBLIC_LS_CHECKOUT_PRO_MONTHLY }}
          PUBLIC_LS_CHECKOUT_PRO_YEARLY: ${{ secrets.PUBLIC_LS_CHECKOUT_PRO_YEARLY }}
          PUBLIC_LS_CHECKOUT_PROPLUS_MONTHLY: ${{ secrets.PUBLIC_LS_CHECKOUT_PROPLUS_MONTHLY }}
          PUBLIC_LS_CHECKOUT_PROPLUS_YEARLY: ${{ secrets.PUBLIC_LS_CHECKOUT_PROPLUS_YEARLY }}
          PUBLIC_LS_CUSTOMER_PORTAL: ${{ secrets.PUBLIC_LS_CUSTOMER_PORTAL }}
        run: pnpm build

      - name: Preserve CNAME
        run: echo "hoard.services" > web/build/CNAME

      - name: SPA fallback for GitHub Pages (deep links → 404 → SPA shell)
        run: cp web/build/200.html web/build/404.html

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./web/build
          publish_branch: gh-pages
          force_orphan: true
          commit_message: 'deploy: web ${{ github.sha }}'
