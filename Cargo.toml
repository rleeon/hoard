[workspace]
resolver = "2"
members = [
    "crates/hoard-core",
    "crates/hoard-server",
    "crates/hoard-cli",
    "crates/hoard-admin",
    "crates/hoard-agent",
    "crates/hoard-desktop",
    "crates/hoard-manifest",
    "crates/hoard-detect",
    "crates/hoard-watcher",
]

[workspace.package]
edition = "2021"
version = "1.3.3"
authors = ["insider <raileonoliva@gmail.com>"]
license = "AGPL-3.0"

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# HTTP server
axum = { version = "0.7", features = ["multipart"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["trace", "cors"] }

# HTTP client
reqwest = { version = "0.12", features = ["json", "multipart", "stream"] }

# Database
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "migrate", "time", "uuid"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# CLI args
clap = { version = "4", features = ["derive", "env"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Error handling
anyhow = "1"
thiserror = "1"

# Crypto
argon2 = "0.5"
blake3 = "1"
sha2 = "0.10"
hex = "0.4"
rand = "0.8"

# Compression
async-compression = { version = "0.4", features = ["tokio", "zstd"] }
tokio-tar = "0.3"

# Time
time = { version = "0.3", features = ["serde", "serde-well-known", "formatting", "parsing", "macros"] }

# UUID
uuid = { version = "1", features = ["v4", "serde"] }

# YAML (Ludusavi manifest)
serde_yaml = "0.9"

# Misc
tokio-stream = "0.1"
figment = { version = "0.10", features = ["toml", "env"] }
directories = "5"
indicatif = "0.17"
tokio-util = { version = "0.7", features = ["io"] }
futures = "0.3"
bytes = "1"
regex = "1"

# Process & filesystem watching (Phase 4)
sysinfo = { version = "0.32", default-features = false, features = ["system"] }
notify = "6"
notify-debouncer-mini = "0.4"
