[package]
name = "hoard-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Hoard desktop app — auto-backups for game saves"

[[bin]]
name = "hoard-desktop"
path = "src/main.rs"

[lib]
name = "hoard_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
path = "src/lib.rs"

[features]
# Enables Tauri's custom-protocol asset loader so production builds serve the
# bundled frontend from `tauri://localhost` instead of falling back to the
# Vite dev URL. Default-on so plain `cargo build --release` produces a
# working app; `cargo tauri dev` / `--no-default-features` opt out for HMR.
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
hoard-agent = { path = "../hoard-agent" }
hoard-manifest = { path = "../hoard-manifest" }

# `unstable` enables the multiwebview API: the Pro overlay embeds real web
# panels (YouTube/streaming) as child webviews inside its own window so they
# float over the game like the photo/note panels — community build never uses
# it but the flag is harmless when unused.
tauri = { version = "2", features = ["macos-private-api", "tray-icon", "image-png", "unstable"] }
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"
tauri-plugin-os = "2"
tauri-plugin-shell = "2"
tauri-plugin-store = "2"
# Deep link — registers the `hoard://` scheme so the OAuth callback from
# Hoard Cloud can hand the desktop app a Supabase access_token.
tauri-plugin-deep-link = "2"
# Global hotkey support (fires regardless of focus). Generic capability; the
# binding (Ctrl+O for the Pro overlay) is registered at runtime by the UI only
# when the Pro layer is present — the community build ships the plugin unused.
tauri-plugin-global-shortcut = "2"
keyring = { version = "3", default-features = false, features = [
    "apple-native",
    "windows-native",
    "sync-secret-service",
    "crypto-rust",
] }
toml = { workspace = true }
# Ed25519 minisign verifier — gates the auto-updater so an installer is only
# run (as root, via pkexec) after its signature matches the embedded release
# key. Same crate/key the server's `hoard-server upgrade` uses. See ADR 0017.
minisign-verify = "0.2"

reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = "0.2"
time = { workspace = true, features = ["local-offset"] }
uuid = { workspace = true }
futures = { workspace = true }
tokio-tungstenite = { workspace = true }

# Linux-only: the Pro overlay's web panels are glued top-level GTK windows, and
# "crop" clips them to a sub-rectangle via the X11 SHAPE extension (gdk window
# shape region). Tauri exposes the underlying GtkWindow on Linux; we reach gdk
# through it. Pinned to the same 0.18 line tao/wry already resolve so the
# `gtk::ApplicationWindow` types unify (cargo tree: gtk/gdk 0.18.2).
[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"

[dev-dependencies]
tempfile = { workspace = true }
