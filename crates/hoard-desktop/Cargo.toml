[package]
name = "hoard-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Hoard desktop app — auto-backups for game saves"

[[bin]]
name = "hoard-desktop"
path = "src/main.rs"

[lib]
name = "hoard_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
path = "src/lib.rs"

[features]
# Enables Tauri's custom-protocol asset loader so production builds serve the
# bundled frontend from `tauri://localhost` instead of falling back to the
# Vite dev URL. Default-on so plain `cargo build --release` produces a
# working app; `cargo tauri dev` / `--no-default-features` opt out for HMR.
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
hoard-agent = { path = "../hoard-agent" }
hoard-manifest = { path = "../hoard-manifest" }

tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"
tauri-plugin-os = "2"
tauri-plugin-shell = "2"
tauri-plugin-store = "2"

reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = "0.2"
time = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
