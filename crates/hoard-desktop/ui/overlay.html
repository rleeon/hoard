<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hoard Overlay</title>
    <!-- Transparent window: the game must show through. The Svelte bundle
         imports the main app's `app.css`, which paints an opaque obsidian
         `body` background + a `body::before` grain layer. That stylesheet is
         injected after this block, so we override it with `!important` (and
         drop the grain) to keep the overlay genuinely see-through — only the
         Pro panels paint on top. -->
    <style>
      html,
      body,
      #overlay {
        margin: 0;
        background: transparent !important;
        background-image: none !important;
        overflow: hidden;
      }
      body::before {
        display: none !important;
      }
    </style>
  </head>
  <body class="text-zinc-100 antialiased">
    <div id="overlay"></div>
    <script type="module" src="/src/overlay.ts"></script>
  </body>
</html>
