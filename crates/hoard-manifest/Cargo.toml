[package]
name = "hoard-manifest"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Game save-path manifest: curated game definitions + placeholder resolution"

[features]
default = ["bundled-catalog"]
# Embed the PCGamingWiki-derived save-path catalogue in the binary.
#
# The data is CC BY-NC-SA 3.0: the NonCommercial clause makes bundling it into
# a build distributed alongside a paid subscription legally doubtful. Turning
# this off produces a binary with no catalogue inside, which fetches it on
# first run into the user's own cache instead, the same path the in-app
# "update catalogue" button already uses. Detection then needs one network
# round-trip before it works, which is exactly the trade being made.
#
# See NOTICE and crates/hoard-manifest/data/README.md.
bundled-catalog = []

[dependencies]
hoard-core = { path = "../hoard-core" }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
directories = { workspace = true }
strsim = { workspace = true }
zstd = { workspace = true }

[dev-dependencies]
tempfile = "3"
