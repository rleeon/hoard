[package]
name = "hoard-agent"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Shared client logic for the Hoard CLI and desktop app"

[lib]
name = "hoard_agent"
path = "src/lib.rs"

[dependencies]
hoard-core = { path = "../hoard-core" }
hoard-manifest = { path = "../hoard-manifest" }
hoard-detect = { path = "../hoard-detect" }

tokio = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
time = { workspace = true }
uuid = { workspace = true }
directories = { workspace = true }
async-compression = { workspace = true }
tokio-tar = { workspace = true }
tokio-util = { workspace = true }
futures = { workspace = true }
bytes = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
sysinfo = { workspace = true }
notify = { workspace = true }
notify-debouncer-mini = { workspace = true }

# OS-native credential storage. Linux uses libsecret via sync-secret-service
# (no async runtime in the way), Windows uses Credential Manager, macOS uses
# the Keychain. When none of these are available the desktop client falls
# back to a 0600 file — see `credentials.rs`.
keyring = { version = "3", default-features = false, features = [
    "apple-native",
    "windows-native",
    "sync-secret-service",
    "crypto-rust",
] }
