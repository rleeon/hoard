[package]
name = "hoard-agent"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Shared client logic for the Hoard CLI and desktop app"

[lib]
name = "hoard_agent"
path = "src/lib.rs"

[dependencies]
hoard-core = { path = "../hoard-core" }
hoard-manifest = { path = "../hoard-manifest" }

tokio = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
time = { workspace = true }
directories = { workspace = true }
async-compression = { workspace = true }
tokio-tar = { workspace = true }
tokio-util = { workspace = true }
bytes = { workspace = true }
futures = { workspace = true }
tokio-tungstenite = { workspace = true }
rustls = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
uuid = { workspace = true }
base64 = { workspace = true }
sysinfo = { workspace = true }
notify = { workspace = true }
notify-debouncer-mini = { workspace = true }
# Restoring the original mtime onto extracted files. The tar header carries
# each file's source mtime; without re-applying it the freshly-written file
# gets mtime=now and would always beat the local copy in the conflict-aware
# diff (`agent::local_mtime_wins`), so cloud pulls looked "newer" forever.
filetime = "0.2"

# Lectura del ÍNDICE de comprimidos (sin descomprimir) para puntuar saves
# that live inside a .zip (Factorio and several indies). `default-features = false`:
# we only read the central directory (the entry names) and never inflate content, so
# there is no need to drag codecs in (deflate, zstd, bzip2 and the rest). Its only
# consumer is `scoring::archive_looks_like_save`, so it stays out of
# `[workspace.dependencies]`.
zip = { version = "2", default-features = false }

# OS-native credential storage. Linux uses libsecret via sync-secret-service
# (no async runtime in the way), Windows uses Credential Manager, macOS uses
# the Keychain. When none of these are available the desktop client falls
# back to a 0600 file, see `credentials.rs`.
keyring = { version = "3", default-features = false, features = [
    "apple-native",
    "windows-native",
    "sync-secret-service",
    "crypto-rust",
] }

# The minisign verifier (Ed25519). An installer downloaded from the internet runs
# with privileges, so none is applied without a valid CI signature (ADR 0017). It
# used to be desktop-only; it lives here because the terminal installs the app just
# as the app updates itself, and the check has to be the same on both roads.
minisign-verify = "0.2"

# Windows-only registry access for `pathexpand` (OneDrive-aware Known Folder
# lookups via User Shell Folders) and `steam` (Steam's install path from
# `Valve\Steam\SteamPath`, so non-default install drives are found). Kept
# under `cfg(windows)` so non-Windows builds don't pull it in.
#
# `rusqlite` powers the GOG Galaxy enumerator in `launchers.rs`: Galaxy
# stores its installed-product index in `galaxy-2.0.db`, a sqlite file
# under `%LOCALAPPDATA%`. Feature `bundled` compiles sqlite into the
# binary so Windows hosts without a system sqlite still work (sqlite is
# not part of the standard Windows install). Single consumer + cfg-gated,
# so it also stays out of `[workspace.dependencies]`.

# `geteuid` in `install/`: part of deciding whether privileges can be elevated
# without waiting on a human who, inside `curl … | sh`, does not exist. It is already
# in the dependency tree (tokio drags it in on unix), so it adds no compilation; one
# consumer and cfg-gated, hence not in the workspace.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
winreg = { workspace = true }
# `SendMessageTimeoutW`, to broadcast `WM_SETTINGCHANGE` after touching the user's
# PATH in `install::ensure_cli_reachable`. Without that broadcast the change is
# written but invisible: Explorer keeps its environment block cached and every
# terminal it launches inherits the old one, so `hoard` would not exist until you
# signed out. Checked against a real Windows machine.
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    # `GetLogicalDrives` and `GetDriveTypeW` in `roots::internal_drive_roots`: an
    # emulator unzipped onto D: leaves no trace in %APPDATA%, so the OS has to be
    # asked which fixed drives exist before it can be looked for.
    "Win32_Storage_FileSystem",
    # `DRIVE_FIXED`, which lives in a different module from the two functions using it.
    "Win32_System_WindowsProgramming",
] }
rusqlite = { version = "0.32", features = ["bundled"] }

[dev-dependencies]
tempfile = { workspace = true }
# `start_paused` for the upload retry tests: the pacer backoff climbs to
# seconds, and a suite that actually sleeps through it is a suite nobody runs.
# Dev-only under resolver 2, so no production build picks it up.
tokio = { workspace = true, features = ["test-util"] }
# Mirror of the cfg(windows) prod dep: GOG Galaxy's sqlite reader lives in
# `launchers.rs`, but its parser code is OS-agnostic and gets exercised by
# tests on Linux too (synthesised fixture). The dev-dep makes the
# `gog_read_db` helper compile cross-platform so the tests can run.
[target.'cfg(not(windows))'.dev-dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
