[package]
name = "hoard-agent"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Shared client logic for the Hoard CLI and desktop app"

[lib]
name = "hoard_agent"
path = "src/lib.rs"

[dependencies]
hoard-manifest = { path = "../hoard-manifest" }

tokio = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
time = { workspace = true }
directories = { workspace = true }
async-compression = { workspace = true }
tokio-tar = { workspace = true }
tokio-util = { workspace = true }
futures = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
sysinfo = { workspace = true }
notify = { workspace = true }
notify-debouncer-mini = { workspace = true }
# Restoring the original mtime onto extracted files. The tar header carries
# each file's source mtime; without re-applying it the freshly-written file
# gets mtime=now and would always beat the local copy in the conflict-aware
# diff (`agent::local_mtime_wins`), so cloud pulls looked "newer" forever.
filetime = "0.2"

# Lectura del ÍNDICE de comprimidos (sin descomprimir) para puntuar saves
# que viven dentro de un .zip (Factorio y varios indies). `default-features
# = false`: sólo leemos el directorio central (nombres de entrada), nunca
# inflamos contenido, así que no hace falta arrastrar codecs (deflate, zstd,
# bzip2...). Único consumidor: `scoring::archive_looks_like_save`, así que
# se queda fuera de `[workspace.dependencies]`.
zip = { version = "2", default-features = false }

# OS-native credential storage. Linux uses libsecret via sync-secret-service
# (no async runtime in the way), Windows uses Credential Manager, macOS uses
# the Keychain. When none of these are available the desktop client falls
# back to a 0600 file — see `credentials.rs`.
keyring = { version = "3", default-features = false, features = [
    "apple-native",
    "windows-native",
    "sync-secret-service",
    "crypto-rust",
] }

# Windows-only registry access for `pathexpand::expand_registry_path` and
# the OneDrive-aware Known Folder lookups (User Shell Folders). Kept under
# `cfg(windows)` so non-Windows builds don't pull it in. Single consumer,
# so it stays out of `[workspace.dependencies]`.
#
# `rusqlite` powers the GOG Galaxy enumerator in `launchers.rs`: Galaxy
# stores its installed-product index in `galaxy-2.0.db`, a sqlite file
# under `%LOCALAPPDATA%`. Feature `bundled` compiles sqlite into the
# binary so Windows hosts without a system sqlite still work (sqlite is
# not part of the standard Windows install). Single consumer + cfg-gated,
# so it also stays out of `[workspace.dependencies]`.
[target.'cfg(windows)'.dependencies]
winreg = "0.52"
rusqlite = { version = "0.32", features = ["bundled"] }

[dev-dependencies]
tempfile = { workspace = true }
# Mirror of the cfg(windows) prod dep: GOG Galaxy's sqlite reader lives in
# `launchers.rs`, but its parser code is OS-agnostic and gets exercised by
# tests on Linux too (synthesised fixture). The dev-dep makes the
# `gog_read_db` helper compile cross-platform so the tests can run.
[target.'cfg(not(windows))'.dev-dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
