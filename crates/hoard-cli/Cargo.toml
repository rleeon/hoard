[package]
name = "hoard-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "hoard"
path = "src/main.rs"

[dependencies]
hoard-agent = { path = "../hoard-agent" }

# La CLI es un cliente del servicio (ADR 0021, Slice 4c): `hoardd` trae el
# cliente IPC + "spawn if absent", y `hoard-core` los tipos que viajan por el
# socket. Igual que el desktop desde el 4b.
hoard-core = { path = "../hoard-core" }
hoardd = { path = "../hoardd" }

tokio = { workspace = true }
toml = { workspace = true }
clap = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = { workspace = true }
anyhow = { workspace = true }
indicatif = { workspace = true }
# `hoard saves` formats the last-backup dates (OffsetDateTime to RFC3339).
time = { workspace = true }
# `--json`: the output types live in `output.rs`; the engine's are not serialised
# (see the module).
serde = { workspace = true }
serde_json = { workspace = true }
# `hoard login` (Cloud) reads the password without echoing it in the terminal.
rpassword = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
