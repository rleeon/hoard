[package]
name = "hoard-screen"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
publish = false
description = "Hoard Pro — native cross-platform in-game overlay."

[[bin]]
name = "hoard-screen"
path = "src/bin/hoard-screen.rs"

# Debian package: `cargo deb -p hoard-screen`. Builds the binary with both Linux
# overlay backends and bundles it to /usr/bin. Runtime deps (libpipewire, etc.)
# are auto-detected from the linked binary.
[package.metadata.deb]
maintainer = "raileonoliva <raileonoliva@gmail.com>"
copyright = "2026, raileonoliva"
section = "x11"
priority = "optional"
extended-description = """\
Hoard Pro native in-game overlay: a window-capture compositor that presents \
panels (captured app windows, images, notes) over a fullscreen game. \
View mode is click-through; Ctrl+O (X11) or the desktop app (Wayland) opens \
the editor. Linux backends: X11 (override-redirect + SHAPE) and Wayland \
(wlr-layer-shell + xdg-desktop-portal/PipeWire capture)."""
features = ["runtime", "wayland"]
assets = [["target/release/hoard-screen", "usr/bin/hoard-screen", "755"]]

[features]
# Default builds the testable, display-free core (scene/geometry/compositor/
# engine/IPC) plus the headless snapshot tool, no native system libraries.
# `runtime` pulls the on-screen overlay window + native window-capture backends.
default = []
# The per-OS native deps are optional and target-gated, so `runtime` only ever
# activates the ones that apply to the host (x11rb on Linux, the `windows` crate
# on Windows, cocoa/core-graphics on macOS); on the other targets the `dep:`
# references are inert (the dependency simply isn't present to enable).
runtime = [
    "dep:x11rb",
    "dep:libc",
    "dep:windows",
    "dep:cocoa",
    "dep:objc",
    "dep:core-graphics",
    "dep:core-foundation",
]
# Wayland window capture via xdg-desktop-portal ScreenCast + PipeWire. Needs
# system libpipewire-0.3-dev + clang at build time (bindgen).
wayland = [
    "dep:ashpd",
    "dep:pipewire",
    "dep:tokio",
    "dep:libc",
    "dep:smithay-client-toolkit",
]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Linux on-screen overlay + X11 window capture. ARGB32 override-redirect
# always-on-top window, SHAPE input region for click-through, XGrabKey for the
# global Ctrl+O, and XComposite for capturing other apps' windows.
[target.'cfg(target_os = "linux")'.dependencies]
x11rb = { version = "0.13", optional = true, features = [
    "composite",
    "shape",
    "damage",
    # XInput2: `XIQueryPointer` is the only thing that reports the mouse's side
    # buttons (8 and 9). The core protocol only has Button1 to Button5, so without
    # this extension the scope cannot be bound to a thumb button.
    "xinput",
] }
libc = { version = "0.2", optional = true }
# Wayland capture stack (feature = "wayland").
ashpd = { version = "0.13", optional = true, default-features = false, features = ["tokio", "screencast"] }
pipewire = { version = "0.10", optional = true }
tokio = { version = "1", optional = true, features = ["rt", "net", "time"] }
# Wayland overlay placement: wlr-layer-shell surface + shm rendering.
smithay-client-toolkit = { version = "0.19", optional = true }

# Windows: Windows.Graphics.Capture (WGC) for per-window capture + a layered
# topmost window (UpdateLayeredWindow) for the click-through overlay, RegisterHotKey
# for the global Ctrl+O. Written on Linux, compiled/validated on a Windows runner.
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", optional = true, features = [
    "Foundation",
    "Graphics",
    "Graphics_Capture",
    "Graphics_DirectX",
    "Graphics_DirectX_Direct3D11",
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D_Fxc",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_DirectComposition",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_WinRT",
    "Win32_System_WinRT_Direct3D11",
    "Win32_System_WinRT_Graphics_Capture",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_HiDpi",
] }

# macOS: window list + capture via Core Graphics (CGWindowList), and a borderless
# always-on-top NSWindow with ignoresMouseEvents for the click-through overlay
# (cocoa/objc). Editor toggle arrives over IPC (no app-level global hotkey).
# Written on Linux, compiled/validated on a macOS runner. ScreenCaptureKit is the
# eventual upgrade over the (still-functional, simpler) CGWindowList path.
[target.'cfg(target_os = "macos")'.dependencies]
cocoa = { version = "0.26", optional = true }
objc = { version = "0.2", optional = true }
core-graphics = { version = "0.24", optional = true }
core-foundation = { version = "0.10", optional = true }
