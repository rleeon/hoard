[package]
name = "hoardd"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Hoard local sync service: owns the engine, speaks IPC to thin clients"

[lib]
name = "hoardd"
path = "src/lib.rs"

[[bin]]
name = "hoardd"
path = "src/main.rs"

[dependencies]
hoard-core = { path = "../hoard-core" }
hoard-agent = { path = "../hoard-agent" }

tokio = { workspace = true }
serde = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = { workspace = true }
clap = { workspace = true }
time = { workspace = true }
uuid = { workspace = true }

# `flock` on the lock file: the real mutex with liveness that replaces the pidfile as
# arbiter (ADR 0021, Part A). The kernel releases it when the process dies, so a
# daemon that crashes does not block the next one, which is exactly what `agent.pid`
# could not do.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Native notifications over the session bus (ADR 0021 D.14.1). It is the same library
# Tauri's notification plugin uses underneath, so the service's notice looks the same
# as the one the desktop used to send. Linux only: the Windows and macOS backends go
# behind the same interface (`notify::Sink`), and until then the frontend keeps
# notifying there.
[target.'cfg(target_os = "linux")'.dependencies]
notify-rust = { workspace = true }

# The XDG portals' client. It is only used inside a Flatpak, where starting at login
# cannot go through systemd: `background` is the only
# interfaz sancionada para pedirlo, y el resto de portales no se compilan.
ashpd = { version = "0.13", default-features = false, features = [
    "tokio",
    "background",
] }

# The named pipe's ACL: with no explicit security descriptor Windows grants
# `Everyone` read access to the pipe, and game names, paths and the sync's commands
# travel over it. The ADR asks for user-only permissions (0600 or an ACL), so
# construimos un SD con SDDL desde el SID del usuario actual.
[target.'cfg(windows)'.dependencies]
# The Run entry under HKCU that starts the service at logon when the Task
# Scheduler won't take a task (see `autostart::platform`).
winreg = { workspace = true }
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Threading",
] }

[dev-dependencies]
tempfile = { workspace = true }
