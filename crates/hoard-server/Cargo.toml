[package]
name = "hoard-server"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "hoard_server"
path = "src/lib.rs"

[[bin]]
name = "hoard-server"
path = "src/main.rs"

[features]
# `cloud` toggles SaaS mode: Postgres backend, Supabase JWT auth,
# Cloudflare R2 storage, Lemon Squeezy webhooks. With the feature OFF
# the binary stays 100% self-hosted (SQLite + bearer tokens + disk
# storage) and none of the cloud deps compile.
default = []
cloud = [
    "sqlx/postgres",
    "dep:aws-sdk-s3",
    "dep:aws-config",
    "dep:aws-credential-types",
    "dep:aws-smithy-runtime-api",
    "dep:jsonwebtoken",
    "dep:hmac",
    "dep:base64",
]

[dependencies]
hoard-core = { path = "../hoard-core" }

tokio = { workspace = true }
axum = { workspace = true }
tower-http = { workspace = true }
tower = { workspace = true }
# Per-IP request rate limiting (GovernorLayer). 0.4 tracks the axum 0.7 line;
# `governor` is its underlying limiter, named directly only to spell out the
# layer's middleware type in `ratelimit.rs`.
tower_governor = "0.4"
governor = "0.6"
sqlx = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
figment = { workspace = true }
clap = { workspace = true }
time = { workspace = true }
uuid = { workspace = true }
hex = { workspace = true }
sha2 = { workspace = true }
async-compression = { workspace = true }
tokio-tar = { workspace = true }
tokio-stream = { workspace = true }
tokio-util = { workspace = true }
futures = { workspace = true }
bytes = { workspace = true }
reqwest = { workspace = true }

# Release signature verification for `hoard-server upgrade`. Pure-Rust
# Ed25519 minisign verifier — no libsodium link. See ADR 0017.
minisign-verify = "0.2"

# Cloud-only optional dependencies. Pull in only when --features cloud.
aws-sdk-s3 = { version = "1", optional = true }
aws-config = { version = "1", optional = true }
aws-credential-types = { version = "1", optional = true }
aws-smithy-runtime-api = { version = "1", optional = true }
jsonwebtoken = { version = "9", optional = true }
hmac = { version = "0.12", optional = true }
# Polar webhooks use Standard Webhooks: base64-encoded HMAC-SHA256 over
# `id.timestamp.body`, unlike Lemon Squeezy's hex signature.
base64 = { version = "0.22", optional = true }

[package.metadata.cargo-machete]
# Enabled (under `--features cloud`) to pull the matching aws-smithy
# runtime API version alongside aws-sdk-s3; not named directly in code,
# so machete can't see the use.
ignored = ["aws-smithy-runtime-api"]

[dev-dependencies]
tokio = { workspace = true }
tempfile = { workspace = true }
