[package]
name = "hoard-server"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "hoard_server"
path = "src/lib.rs"

[[bin]]
name = "hoard-server"
path = "src/main.rs"

[features]
# `s3-backend` lets a *self-hosted* server store its blob/chunk bytes on any
# S3-compatible endpoint (MinIO, B2, R2, Garage, Wasabi, or `rclone serve s3`)
# instead of local disk, selected via `[storage] backend = "s3"`. It pulls in
# the (heavy) aws-sdk-s3 stack, so it's a feature, on in `default` for release
# builds, off under `--no-default-features` for a lean disk-only binary. It
# provides the shared S3 client that `cloud` also builds on.
#
# `cloud` toggles SaaS mode: Postgres backend, Supabase JWT auth, Cloudflare R2
# storage, Polar webhooks. With BOTH features OFF the binary stays 100%
# self-hosted (SQLite + bearer tokens + disk storage) and none of the aws deps
# compile.
default = ["s3-backend"]
s3-backend = [
    "dep:aws-sdk-s3",
    "dep:aws-config",
    "dep:aws-credential-types",
    "dep:aws-smithy-runtime-api",
]
cloud = [
    "s3-backend",
    "sqlx/postgres",
    "dep:jsonwebtoken",
    "dep:hmac",
    "dep:base64",
    "dep:zip",
    "dep:tempfile",
    "dep:rand",
]

[dependencies]
hoard-core = { path = "../hoard-core" }

tokio = { workspace = true }
axum = { workspace = true }
tower-http = { workspace = true }
# Per-IP request rate limiting (GovernorLayer). 0.4 tracks the axum 0.7 line;
# `governor` is its underlying limiter, named directly only to spell out the
# layer's middleware type in `ratelimit.rs`.
tower_governor = "0.4"
governor = "0.6"
sqlx = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
figment = { workspace = true }
clap = { workspace = true }
time = { workspace = true }
uuid = { workspace = true }
hex = { workspace = true }
sha2 = { workspace = true }
async-compression = { workspace = true }
tokio-tar = { workspace = true }
tokio-stream = { workspace = true }
tokio-util = { workspace = true }
futures = { workspace = true }
bytes = { workspace = true }
reqwest = { workspace = true }
# Object-safe async trait for the `BlobStore` abstraction (local disk vs S3).
# Already in the tree transitively (aws-sdk-s3, sqlx); naming it directly just
# lets us derive `#[async_trait]` on our own trait.
async-trait = { workspace = true }

# Release signature verification for `hoard-server upgrade`. Pure-Rust
# Ed25519 minisign verifier, no libsodium link. See ADR 0017.
minisign-verify = "0.2"

# Cloud-only optional dependencies. Pull in only when --features cloud.
aws-sdk-s3 = { version = "1", optional = true }
aws-config = { version = "1", optional = true }
aws-credential-types = { version = "1", optional = true }
aws-smithy-runtime-api = { version = "1", optional = true }
jsonwebtoken = { version = "9", optional = true }
hmac = { version = "0.12", optional = true }
# Polar webhooks use Standard Webhooks: base64-encoded HMAC-SHA256 over
# `id.timestamp.body`.
base64 = { version = "0.22", optional = true }
# Account-export ZIP writer. Entries are `Stored` (game saves are already
# compressed) so this is just the container format.
zip = { workspace = true, optional = true }
# Export worker builds the ZIP on a temp file (streamed to R2) to keep the
# whole archive off the heap.
tempfile = { workspace = true, optional = true }
# Device-pairing codes (CLI browserless login): random device_code + user_code.
rand = { workspace = true, optional = true }

[package.metadata.cargo-machete]
# Enabled (under `--features cloud`) to pull the matching aws-smithy
# runtime API version alongside aws-sdk-s3; not named directly in code,
# so machete can't see the use.
ignored = ["aws-smithy-runtime-api"]

[dev-dependencies]
tokio = { workspace = true }
tempfile = { workspace = true }
# `ServiceExt::oneshot`, to exercise the router without opening a port. It is
# what checks that the blob PUT stays outside the limiter (ratelimit::apply).
tower = { workspace = true, features = ["util"] }
# Used by the S3 backend integration test (tests/s3_backend.rs).
uuid = { workspace = true }
hex = { workspace = true }
sha2 = { workspace = true }
