# cargo-deny config for the Hoard workspace.
#
# We run this in CI (.github/workflows/ci.yml → cargo-deny job) and locally
# via `cargo deny check`. The defaults are picked to be strict enough to
# catch new GPL-incompatible deps and known advisories, but not so strict
# that minor-version churn breaks the build.

[graph]
all-features = true

[advisories]
version = 2
# We block on unmaintained crates and security advisories by default. If a
# specific RUSTSEC ID is unavoidable for now, add it to `ignore` with a link
# to the tracking issue explaining the exposure.
yanked = "deny"
ignore = [
    # gtk-rs GTK3 bindings — unmaintained but still the only way to render
    # the Tauri webview on Linux. Pulled in transitively by tauri-runtime-wry
    # → webkit2gtk → atk/gtk/gdk/cairo/glib/pango/etc. Upstream Tauri is
    # tracking the migration to GTK4; until that ships there is no safe
    # upgrade.
    "RUSTSEC-2024-0411",
    "RUSTSEC-2024-0412",
    "RUSTSEC-2024-0413",
    "RUSTSEC-2024-0414",
    "RUSTSEC-2024-0415",
    "RUSTSEC-2024-0416",
    "RUSTSEC-2024-0417",
    "RUSTSEC-2024-0418",
    "RUSTSEC-2024-0419",
    "RUSTSEC-2024-0420",
    # proc-macro-error: unmaintained, used by older proc-macro crates we
    # don't control (transitive via tauri-macros or similar).
    "RUSTSEC-2024-0370",
    # number_prefix: unmaintained, transitive via indicatif used by the CLI
    # progress bars. No safe upgrade — replacement crate isn't drop-in.
    "RUSTSEC-2025-0119",
    # unic-* family: open-i18n/rust-unic is unmaintained as a group. Pulled
    # transitively by urlpattern → tauri-utils. Tauri's tracking issue:
    # https://github.com/rustsec/advisory-db/issues/2414. No safe upgrade.
    "RUSTSEC-2025-0075", # unic-char-range
    "RUSTSEC-2025-0080", # unic-common
    "RUSTSEC-2025-0081", # unic-char-property
    "RUSTSEC-2025-0098", # unic-ucd-version
    "RUSTSEC-2025-0100", # unic-ucd-ident
    # tokio-tar PAX header smuggling. We only extract tarballs that come from
    # the server we trust (hoard-server) over an authenticated session, so the
    # smuggling vector doesn't apply to our threat model. Tracked in #upstream
    # — we'll swap to the maintained `astral-tokio-tar` fork or `tar` (sync,
    # ran on a blocking task) once 1.5 lands and we touch the restore path.
    "RUSTSEC-2025-0111",
]

[licenses]
version = 2
# Hoard itself is AGPL-3.0; copyleft-compatible permissive licenses are fine
# for transitive deps. Anything missing from this list trips the build so we
# notice new ecosystem-wide license shifts (e.g. a crate flipping to BUSL).
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "MPL-2.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "OpenSSL",
    "AGPL-3.0",
]
confidence-threshold = 0.8
# `ring` ships under a custom license that doesn't have an SPDX identifier;
# upstream has acknowledged this and the contents are equivalent to
# BSD-3-Clause + OpenSSL. We accept it explicitly here.
exceptions = [
    { allow = ["OpenSSL"], crate = "ring" },
]

[[licenses.clarify]]
crate = "ring"
expression = "ISC AND MIT AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[bans]
# Multiple versions of the same crate bloat the build and usually indicate a
# transitive dep that hasn't caught up. We allow it with a warning; CI will
# not fail solely on duplicates so we can ship while waiting on upstream.
multiple-versions = "warn"
# `wildcards = "deny"` catches public crates that pin to `version = "*"`,
# but flags our own intra-workspace path deps (which have no version field
# and are therefore parsed as `*`). `allow-wildcard-paths = true` exempts
# path-only deps — those resolve from the workspace, never from the registry,
# so the wildcard has no security implication.
wildcards = "deny"
allow-wildcard-paths = true
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
