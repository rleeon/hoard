# cargo-deny config for the Hoard workspace.
#
# We run this in CI (.github/workflows/ci.yml → cargo-deny job) and locally
# via `cargo deny check`. The defaults are picked to be strict enough to
# catch new GPL-incompatible deps and known advisories, but not so strict
# that minor-version churn breaks the build.

[graph]
all-features = true

[advisories]
version = 2
# We block on unmaintained crates and security advisories by default. If a
# specific RUSTSEC ID is unavoidable for now, add it to `ignore` with a link
# to the tracking issue explaining the exposure.
yanked = "deny"
ignore = []

[licenses]
version = 2
# Hoard itself is AGPL-3.0; copyleft-compatible permissive licenses are fine
# for transitive deps. Anything missing from this list trips the build so we
# notice new ecosystem-wide license shifts (e.g. a crate flipping to BUSL).
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "MPL-2.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "OpenSSL",
    "AGPL-3.0",
]
confidence-threshold = 0.8
# `ring` ships under a custom license that doesn't have an SPDX identifier;
# upstream has acknowledged this and the contents are equivalent to
# BSD-3-Clause + OpenSSL. We accept it explicitly here.
exceptions = [
    { allow = ["OpenSSL"], crate = "ring" },
]

[[licenses.clarify]]
crate = "ring"
expression = "ISC AND MIT AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[bans]
# Multiple versions of the same crate bloat the build and usually indicate a
# transitive dep that hasn't caught up. We allow it with a warning; CI will
# not fail solely on duplicates so we can ship while waiting on upstream.
multiple-versions = "warn"
wildcards = "deny"
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
